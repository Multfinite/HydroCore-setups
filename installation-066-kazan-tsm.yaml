  - 'relay_0xC1:7 — реле медленных импульсов (герконовые расходомеры): в коде это TDevicePneumaticValve.CreateOnModuleSuperBIO(193,
    7), переключается вместе с командой счётчику (#01L / #01F) в SetSlowImpulseMode; в гидравлическом графе не участвует,
    поэтому в число пневмозадвижек не входит.'
  - 'Виртуальные устройства (ДВ 1 и Барометр 1 — зеркала каналов ДД 2/ДД 3) из схемы удалены: на установке таких приборов
