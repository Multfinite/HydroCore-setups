    edges_comments:
    - Трубы являются устройствами, однако записывать их в список устройств значит сделать мусорку из конфига.
    - Поэтому они создаются при инициализации установки из конфига. Существует несколько форматов записи связи двух устройств.
    - Создаются как типы труб с корректной топологией (все найденные вершины-сокеты присоединяются к одной вертиуальной вершинЕ,
      образуя связь все-ко-всем)
    - так и конкретные экземпляры труб. Если имя трубы не указано (через @) значит она анонимная.
    - Один сокет может подключаться только к одному сокету. Если нужно как-то разветвить - сделайте устройство-прослойку.
    - pipe в [${pipe}@${name} не обязательно указывать явно, если сделать ${name} то это подхватиться.
    - '-------------------------------------------------------------------------------------'
    - Форма записи 1 - прямая пара
    - d1|s <-> s|d2
    - '[ [${d1}, ${d1:s}], [${d2}, ${d2:s}] ]'
    - '-------------------------------------------------------------------------------------'
    - Форма записи 2 - пара через трубу. быстрая запись. Если не указаны сокеты со стороны трубы, они будут использованы по
      порядку.
    - При этом можно указывать сокеты только для отдельных труб.
    - d1|s <-> s1|pipe|s2 <-> s|d2
    - '[ [], [${d1}, ${d1:s1}], [${d2}, ${d2:s}]]'
    - '[ [], [${d1}, ${d1:s1}, ${pipe:s1}], [${d2}, ${d2:s}, ${pipe:s2}]]'
    - '[ [${pipe}@${name}], [${d1}, ${d1:s}], [${d2}, ${d2:s}}] ]'
    - '[ [${pipe}@${name}], [${d1}, ${d1:s}, ${pipe@name:s1}], [${d2}, ${d2:s},  ${pipe@name:s2}] ]'
    - '-------------------------------------------------------------------------------------'
    - Форма записи 3 - Множественное добавление к одной трубе. Если сокеты со стороны трубы не указаны, они будут созданы
      автоматически.
    - При этом можно указывать сокеты только для отдельных труб.
    - '[ [], [${d1}, ${d1:s1}], ... , [${dn}, ${dn:s}]]'
    - '[ [], [${d1}, ${d1:s1}, ${pipe:s1}], ... , [${dn}, ${dn:s}, ${pipe:s2}]]'
    - '[ [${pipe}@${name}], [${d1}, ${d1:s}], ... , [${dn}, ${dn:s}}] ]'
    - '[ [${pipe}@${name}], [${d1}, ${d1:s}, ${pipe@name:s1}], ... , [${dn}, ${dn:s},  ${pipe@name:s2}] ]'
