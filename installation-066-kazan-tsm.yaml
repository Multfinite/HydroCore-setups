  - Верхний уровень — тип интерфейса, к которому подключён прибор; ниже — метрологическая роль.
  - 'Virtual зарезервирован под виртуальные (эмулируемые) устройства с настраиваемыми параметрами: сейчас таких устройств
    в схеме нет.'
  - hydrometer — как в исходном конфиге (ДВ 1 был его единственным экземпляром и удалён как Virtual).
