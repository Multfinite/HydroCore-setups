  delphi_mapping_comments:
  - Промежуточная совместимость с програмой на дельфи.
  - Ключ - имя компонента на дельфи, значение - имя устройства здесь.
  - Counter и ThermoGigrometer создаются в коде (TFlowPlantEngine.Create), а не на форме.
  - Контакт медленных импульсов и ТПУ на форме отсутствуют (создаются в коде), поэтому в маппинге их нет.
  - 'Hygrometer1 и Barometer1 (Virtual) в маппинг не включены: виртуальных устройств в схеме нет.'
  delphi_mapping:
    Flowmeter1: flowmeter_0x1:0
    Flowmeter2: flowmeter_0x1:1
    Flowmeter3: flowmeter_0x1:2
    Flowmeter4: flowmeter_0x1:3
    Thermometer1: thermometer_0x21:0
    Thermometer2: thermometer_0x21:1
    Thermometer3: thermometer_0x21:2
    Thermometer4: thermometer_0x21:3
    Thermometer5: thermometer_0x20:0
    Thermometer6: thermometer_0x20:1
    Thermometer7: thermometer_0x20:2
    Thermometer8: thermometer_0x20:3
    Thermometer9: thermometer_0x22:1
    Thermometer10: thermometer_0x22:0
    Thermometer11: thermometer_0x22:2
    Thermometer12: thermometer_0x23:0
    Manometer1: manometer_0x5:4
    Manometer2: manometer_0x5:6
    Manometer3: manometer_0x5:5
    ElectricValve1: valve_0x50:0
    ElectricValve2: valve_0x50:1
    ElectricValve3: valve_0x50:2
    ElectricValve4: valve_0x51:0
    PneumaticValve1: valve_0xC1:0
    PneumaticValve2: valve_0xC1:3
    PneumaticValve3: valve_0xC1:1
    PneumaticValve4: valve_0xC1:2
    PneumaticValve5: valve_0xC1:5
    PneumaticValve6: valve_0xC1:4
    PneumaticValve7: valve_0xC1:6
    PneumaticValve8: valve_0x50:6
    PneumaticValve9: valve_0x50:7
    PneumaticValve10: valve_0xC1:8
    PneumaticValve11: valve_0xC1:9
    BlcedValve1: valve_0x51:8
    BlcedValve2: valve_0x51:7
    BlcedValve3: valve_0x51:6
    LevelDetector1: ld_0x51:8
    LevelDetector2: ld_0x51:9
    LevelDetector3: ld_0x50:8
    LevelDetector4: ld_0x50:9
    Scales1: scales_0x80
    Scales2: scales_0x81
    Scales3: scales_0x82
    FCD1: fcd_0x90:0
    FCD2: fcd_0x90:1
    FCD3: fcd_0x90:2
    Pump1: pump_0x2
    Pump2: pump_0x9
    Counter: counter_0x1
    ThermoGigrometer: thermogigrometer_0x40
  setup_comments:
  - В setup, если параметр не указан, выполняется попытка автоопределения (если поддерживается).
  - 'Количества приборов/механизмов и привязки (расходомер↔термометр, весы↔термометр, стол↔задвижки) не задаются: вычисляются
    из plant.devices и plant.graph.'
  - devices_calibrating — FP_DEVICES_CALIBRATING (ПРЭМы).
  - 'Рабочие столы: столы 2 и 3 отличаются только приборами, задвижки у них общие.'
  - 'Файловые пути, имена логов и отчётов в конфиге не хранятся: это не описывает установку.'
  setup:
    heating: false
    flowmeter_mass: true
    measurement_methodology_36_65: true
    fast_discharge: false
    counter_new: false
    manometer_second: true
    generator: true
    pumps_always_together: false
    pumps_consecutively: false
    pumps_unoperated_offset: 9
    fastwel_comments:
    - Т.к. это по сути драйвер, т.е. interface в определении этого конфига, это пое нужно будет в итоге удалить, а fastwel
      станет просто типом интерфейса.
    fastwel: false
    prover_comments:
    - Либо структура, либо false. Или "auto".
    - 'Поля: `thermometer`, `manometer`, `valve`.'
    - В сборке №066 ТПУ выключен (FP_PROVER_SUPPORT=false), модуль ТПУ ($25) не создаётся.
    - 'Бывшая ссылка valve_0x80:3 недействительна: у модуля Valve есть только задвижки 0..2, такого устройства нет в devices.'
    - 'Если ТПУ включат: thermometer — ДТ 1 (thermometer_0x21:0, FP_PROVER_THERMOMETER_NUMBER=1), manometer — ДД 2 (manometer_0x5:6,
      «давление №2 используется для ТПУ»), valve — указать реальную задвижку.'
    prover: false
    batcher: false
    rotameter_comments:
    - Либо структура, либо false. Или "auto"
    - 'Поля: `channel.current`, `channel.pressure`.'
    rotameter: false
    thermometer:
      ambient_comments:
      - Термометр температуры окружающего воздуха.
      ambient: thermometer_0x21:0
      flowmeter_comments:
      - Может либо быть структурой с картой, указывающей, какие расходомеры к каким термометрам. Ключ - имя расходомера, значение
        - имя термоментра.
      - Для карты `default` это ключевое слово, задающее какой термометр брать, если расходомер не указан в карте. Если такого
        поля нет, отсуствие в карте расходомера считается ошибкой.
      - Либо можно вместо структуры указать имя одного термометра как значение поля для всех расходомеров.
      flowmeter:
        flowmeter_0x1:0: thermometer_0x20:0
        flowmeter_0x1:1: thermometer_0x20:1
        flowmeter_0x1:2: thermometer_0x20:2
        flowmeter_0x1:3: thermometer_0x20:3
      scales_comments:
      - Аналогично `flowmeter`, но для весов.
      scales:
        scales_0x80: thermometer_0x22:1
        scales_0x81: thermometer_0x22:0
        scales_0x82: thermometer_0x22:2
      coriolis:
        input: thermometer_0x21:2
        output: thermometer_0x21:3
    manometer:
      input: manometer_0x5:4
      output: manometer_0x5:6
      sample: manometer_0x5:5
    level_detector:
      protection: ld_0x51:8
      spill_start:
      - ld_0x51:8
      - ld_0x51:9
      desk:
      - ld_0x50:8
      - ld_0x50:9
      - ld_0x50:9
    pipeline:
      volume:
        scales_0x80: 0.1
        scales_0x81: 0.3
        scales_0x82: 1.5
      flowmeter_by_valve:
        '1': flowmeter_0x1:1
        '2': flowmeter_0x1:1
        '3': flowmeter_0x1:2
        '4': flowmeter_0x1:3
      pump_frequency_by_valve:
        '1': 15
        '2': 15
        '3': 10
        '4': 10
      filling_valve_numbers:
      - 1
      - 2
      valve:
        filling: valve_0x50:6
        bypass: valve_0x50:7
    routing_comments:
    - Explicit replacements for SetPneumaticValves' former hard-coded (flowmeter,FCD)->valve and pump-count->valve cases.
      Values were copied from the current implementation.
    - flowmeter_number and fcd_number are 1-based component numbers; fcd_number 0 means no FCD.
    routing:
      flowmeter_fcd:
      - flowmeter_number: 4
        fcd_number: 0
        valves:
        - valve_0xC1:4
      - flowmeter_number: 4
        fcd_number: 3
        valves:
        - valve_0xC1:5
      pump_count:
      - pump_count: 2
        valves:
        - valve_0xC1:6
      collider:
        desk_1_valves:
        - valve_0xC1:3
        - valve_0xC1:1
        - valve_0x50:7
        other_desk_valves:
        - valve_0xC1:2
        - valve_0xC1:5
        - valve_0x50:7
        partial_electric_valve: valve_0x50:2
        partial_position: 50
        minimum_pressure: 2
        minimum_manual_pressure: 2.5
        initial_regulator_pressure_per_power: 0.32
        regulator_pressure_per_power: 0.2
    desk_comments:
    - Здесь указываются рабочие столы. Не нужно объяснять, что нужно включить вохможность переключать столы, если их больше
      одного?
    - 'Каждому рабочему стола соотвествует определённая конфигурация задвижек: указываются только те задвижки, которые должны
      быть открыты.'
    - В дельфи столов три (FP_DESKS_COUNT=3); столы 2 и 3 открывают одну и ту же пару задвижек (ПЗ 3 и ПЗ 4), отличаются только
      термометрами/манометрами.
    - fast_discharge — прямого соответствия в дельфи нет (есть режим медленных импульсов и галки на форме проливки); уточнить.
    desk:
    - valves:
      - valve_0xC1:0
      - valve_0xC1:3
      thermometer:
        input: thermometer_0x21:0
        output: thermometer_0x21:3
    - valves:
      - valve_0xC1:1
      - valve_0xC1:2
      thermometer:
        input: thermometer_0x21:1
        output: thermometer_0x21:2
    - valves:
      - valve_0xC1:1
      - valve_0xC1:2
      thermometer:
        input: thermometer_0x21:2
        output: thermometer_0x21:3
    devices_calibrating: false
    timeouts_comments:
    - 'Время — в секундах: базовая единица СИ, поэтому целые значения пишутся числом (25, 900, 1), без постфикса.'
    - Если значение не выражается целыми секундами — строка с единицами, например "250ms".
    - 'Блок — бывшие константы PlantConstants: FP_PNEUMATIC_VALVES_SWITCH_TIME, FP_PRESSURE_STABILIZATION_TIME, FP_WATER_DISCHARGE_STABILIZATION_TIME,
      FP_SET_WATER_DISCHARGE_TIME (5 мин), FP_MAX_SPILL_DELAY, FP_PST_*.'
    - Тот же формат у device.time_to_switch.
    timeouts:
      pneumatic_valves_switch_time: 25
      pressure_stabilization_time: 900
      water_discharge_stabilization_time: 15
      set_water_discharge_time: 300
      max_spill_delay: 150
      pst_pouring_out: 140
      pst_setting_water_discharge: 70
      pst_stabilization: 80
    limits_comments:
    - 'Бывшие константы PlantConstants: FP_MAX_PRESSURE_ERROR, FP_PIPELINE_FILLING_MAX_WATER_DISCHARGE, FP_POUR_OUT_SAMPLE_COUNT,
      FP_SCALES_CALIBRATION_WEIGHTS_BUFFER_LENGTH.'
    limits:
      max_pressure_error: 3
      pipeline_filling_max_water_discharge: 10
      pour_out_sample_count: 5
      scales_calibration_weights_buffer_length: 300
    polling_comments:
    - 'Бывшие константы PlantConstants: FP_GETTING_FREQUENCIES_INTERVAL, FP_GETTING_WATER_DISCHARGE_INTERVAL.'
    polling:
      frequency_interval: 1
      water_discharge_interval: 1
